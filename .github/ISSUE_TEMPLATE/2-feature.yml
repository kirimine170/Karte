# .github/ISSUE_TEMPLATE/2-feature.yml
name: "機能要望 / Feature request"
description: "新機能や既存機能の拡張の提案"
title: "[Feature]: "
labels:
  - type/feature
  - status/triage

body:
  - type: input
    id: summary
    attributes:
      label: 概要
      placeholder: 例）OCR機能を追加してほしい
    validations:
      required: true

  - type: textarea
    id: background
    attributes:
      label: 背景・困りごと
      description: なぜこの機能が欲しいかを書いてください
      placeholder: |
        ・今は〜〜のように手作業で対応している
        ・〇〇の場面でいつも不便を感じている
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 提案する機能の内容
      description: UI イメージや処理フローなどがあれば書いてください
      placeholder: |
        ・メニューに「OCR 実行」ボタンを追加する
        ・結果を右ペインの Markdown に自動で貼り付ける
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 他に検討した案
      description: 却下したアイデアなどがあれば
      placeholder: 任意
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: 優先度感
      options:
        - P0: 今すぐ欲しい
        - P1: できれば早めに
        - P2: そのうち
    validations:
      required: false
