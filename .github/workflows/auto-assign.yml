name: Auto-assign author

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  pull-requests: write
  issues: write

jobs:
  assign-issue-author:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    steps:
      - name: Assign issue creator
        uses: actions/github-script@v7
        with:
          script: |
            const assignee = context.payload.issue?.user?.login;
            if (!assignee) {
              core.info('Issue author not found; skipping assignee.');
              return;
            }
            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              assignees: [assignee],
            });

  assign-pr-author:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - name: Assign pull request creator
        uses: actions/github-script@v7
        with:
          script: |
            const assignee = context.payload.pull_request?.user?.login;
            if (!assignee) {
              core.info('Pull request author not found; skipping assignee.');
              return;
            }
            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              assignees: [assignee],
            });
