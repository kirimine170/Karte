name: CI

on:
  push:
    branches: [ "main", "master", "ci" ]
  pull_request:

jobs:
  build:
    name: Build (${{ matrix.os }} - ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
            platform: linux/amd64
          - os: macos-15
            arch: arm64
            platform: darwin/arm64
          - os: macos-15-intel
            arch: amd64
            platform: darwin/amd64
          - os: windows-latest
            arch: amd64
            platform: windows/amd64

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.2
      - name: Debug dist contents
        run: |
          ls -R
          ls -R frontend || true
      - name: Generate Wails JS bindings
        run: wails generate module
        working-directory: .

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend assets
        run: npm run build
        working-directory: frontend

      - name: Verify frontend/dist exists
        run: |
          if [ ! -d "frontend/dist" ] || [ -z "$(ls -A frontend/dist)" ]; then
            echo "Error: frontend/dist is missing or empty"
            exit 1
          fi
          echo "frontend/dist contents:"
          ls -la frontend/dist

      - name: Run Go tests
        run: go test ./internal/...

      - name: Build application
        run: wails build -platform ${{ matrix.platform }}
