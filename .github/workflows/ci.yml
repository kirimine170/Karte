name: Desktop Build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ci.yml'
      - '**/*.go'
      - 'frontend/**'
      - 'build/**'
      - 'templates/**'
      - 'themes/**'
      - 'wails.json'
      - 'go.mod'
      - 'go.sum'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ci.yml'
      - '**/*.go'
      - 'frontend/**'
      - 'build/**'
      - 'templates/**'
      - 'themes/**'
      - 'wails.json'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    env:
      GOFLAGS: -buildvcs=false
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: darwin
            artifact_name: Karte-macOS-universal
            artifact_path: dist/darwin
          - os: ubuntu-22.04
            target: linux
            artifact_name: Karte-linux-amd64
            artifact_path: dist/linux
          - os: windows-latest
            target: windows
            artifact_name: Karte-windows-amd64
            artifact_path: dist/windows

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Download Go dependencies
        run: go mod download

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.2

      - name: Install PortAudio (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev

      - name: Install Wails dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            libgdk-pixbuf2.0-dev \
            libpango1.0-dev \
            libatk1.0-dev \
            libcairo2-dev \
            libgirepository1.0-dev \
            pkg-config

      - name: Install PortAudio (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install portaudio

      - name: Install PortAudio (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          C:\msys64\usr\bin\pacman.exe -S --noconfirm --needed `
            mingw-w64-x86_64-gcc `
            mingw-w64-x86_64-pkg-config `
            mingw-w64-x86_64-portaudio
          "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "PKG_CONFIG_PATH=C:\msys64\mingw64\lib\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CGO_ENABLED=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit

      - name: Prepare placeholder dist
        run: |
          mkdir -p frontend/dist
          touch frontend/dist/.placeholder

      - name: Prepare font file for Windows build
        if: runner.os == 'Windows'
        run: |
          mkdir -p internal/pdf/fonts
          echo "" > internal/pdf/fonts/NotoSansJP-Regular.ttf || touch internal/pdf/fonts/NotoSansJP-Regular.ttf

      - name: Generate Wails JS bindings
        run: wails generate module

      - name: Build frontend assets
        working-directory: frontend
        run: npm run build

      - name: Verify frontend/dist exists
        run: |
          if [ ! -d "frontend/dist" ] || [ -z "$(find frontend/dist -mindepth 1 -maxdepth 1 -print -quit)" ]; then
            echo "Error: frontend/dist is missing or empty"
            exit 1
          fi

      - name: Build application
        run: go run ./cmd/buildmatrix --targets ${{ matrix.target }} --clean

      - name: Archive artifact (macOS)
        if: runner.os == 'macOS'
        run: |
          ditto -c -k --sequesterRsrc --keepParent "${{ matrix.artifact_path }}" "${{ matrix.artifact_name }}.zip"

      - name: Archive artifact (Linux)
        if: runner.os == 'Linux'
        run: |
          cd "${{ matrix.artifact_path }}"
          zip -qry "../../${{ matrix.artifact_name }}.zip" .

      - name: Archive artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "${{ matrix.artifact_path }}\*" -DestinationPath "${{ matrix.artifact_name }}.zip" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.zip
          if-no-files-found: error

  publish-main-release:
    name: Publish latest successful main build
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Move rolling release tag
        run: |
          git tag -f latest-main-successful-build "$GITHUB_SHA"
          git push origin latest-main-successful-build --force

      - name: Publish rolling main release
        uses: ncipollo/release-action@v1
        with:
          tag: latest-main-successful-build
          name: Latest successful main build
          body: |
            This release is automatically updated after the Desktop Build workflow succeeds on main.

            Source commit: ${{ github.sha }}
          artifacts: release-assets/*.zip
          allowUpdates: true
          replacesArtifacts: true
          removeArtifacts: true
          artifactErrorsFailBuild: true
          makeLatest: false
