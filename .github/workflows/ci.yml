name: Desktop Build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ci.yml'
      - '.node-version'
      - '**/*.go'
      - 'frontend/**'
      - 'build/**'
      - 'scripts/package-macos-runtime.sh'
      - 'testdata/renderer-contract/**'
      - 'templates/**'
      - 'themes/**'
      - 'wails.json'
      - 'go.mod'
      - 'go.sum'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ci.yml'
      - '.node-version'
      - '**/*.go'
      - 'frontend/**'
      - 'build/**'
      - 'scripts/package-macos-runtime.sh'
      - 'testdata/renderer-contract/**'
      - 'templates/**'
      - 'themes/**'
      - 'wails.json'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    env:
      GOFLAGS: -buildvcs=false
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: darwin-arm64
            artifact_name: Karte-macOS-apple-silicon
            artifact_path: dist/darwin-arm64
            generate_tags: ""
          - os: macos-15-intel
            target: darwin-amd64
            artifact_name: Karte-macOS-intel
            artifact_path: dist/darwin-amd64
            generate_tags: ""
          - os: ubuntu-22.04
            target: linux
            artifact_name: Karte-linux-amd64
            artifact_path: dist/linux
            generate_tags: universal
          - os: windows-latest
            target: windows
            artifact_name: Karte-windows-amd64
            artifact_path: dist/windows
            generate_tags: universal

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # PR verification only needs source and LFS pointer files. Main
          # artifacts still require the real model assets.
          lfs: ${{ github.event_name != 'pull_request' }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Download Go dependencies
        run: go mod download

      - name: Install Wails CLI
        run: |
          wails_version="$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)"
          test -n "$wails_version"
          go install "github.com/wailsapp/wails/v2/cmd/wails@${wails_version}"

      - name: Install PortAudio (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev

      - name: Install Wails dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            libgdk-pixbuf2.0-dev \
            libpango1.0-dev \
            libatk1.0-dev \
            libcairo2-dev \
            libgirepository1.0-dev \
            pkg-config

      - name: Install PortAudio (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install portaudio

      - name: Install PortAudio (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          C:\msys64\usr\bin\pacman.exe -S --noconfirm --needed `
            mingw-w64-x86_64-gcc `
            mingw-w64-x86_64-pkg-config `
            mingw-w64-x86_64-portaudio
          "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "PKG_CONFIG_PATH=C:\msys64\mingw64\lib\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CGO_ENABLED=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Add runtime DLLs to PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $sherpaDir = go list -m -f "{{.Dir}}" github.com/k2-fsa/sherpa-onnx-go-windows
          $dllDir = Join-Path $sherpaDir "lib\x86_64-pc-windows-gnu"
          if (!(Test-Path $dllDir)) {
            throw "sherpa-onnx runtime DLL directory not found: $dllDir"
          }
          $dllDir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit

      - name: Prepare placeholder dist
        run: |
          mkdir -p frontend/dist
          touch frontend/dist/.placeholder

      - name: Run Renderer dependency and contract tests
        run: |
          go test github.com/kirimine170/KarteRenderer/...
          go test . -run 'Test(KarteRendererDependencyContractFixtures|ExportHTMLToPDFWithRendererUsesTemporaryHTMLInput)$'

      - name: Run Windows regression tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: go test . ./internal/audio ./internal/runtimepath ./internal/screenshot ./internal/webpchunk

      - name: Prepare font file for Windows build
        if: runner.os == 'Windows'
        run: |
          mkdir -p internal/pdf/fonts
          echo "" > internal/pdf/fonts/NotoSansJP-Regular.ttf || touch internal/pdf/fonts/NotoSansJP-Regular.ttf

      - name: Generate Wails JS bindings
        run: |
          if [ -n "${{ matrix.generate_tags }}" ]; then
            wails generate module -tags "${{ matrix.generate_tags }}"
          else
            wails generate module
          fi

      - name: Build frontend assets
        working-directory: frontend
        run: npm run build

      - name: Verify frontend/dist exists
        run: |
          if [ ! -d "frontend/dist" ] || [ -z "$(find frontend/dist -mindepth 1 -maxdepth 1 -print -quit)" ]; then
            echo "Error: frontend/dist is missing or empty"
            exit 1
          fi

      - name: Build application
        run: go run ./cmd/buildmatrix --targets ${{ matrix.target }} --clean

      - name: Bundle and verify macOS runtime dependencies
        # This release-only check requires the full LFS-hosted ASR models.
        # PR builds still compile/package the app while the repository's LFS
        # budget is unavailable; main builds must fetch and verify real models.
        if: runner.os == 'macOS' && github.event_name != 'pull_request'
        run: ./scripts/package-macos-runtime.sh "${{ matrix.artifact_path }}/Karte.app" "${{ matrix.target }}"

      - name: Archive artifact (macOS)
        if: runner.os == 'macOS'
        run: |
          cd "${{ matrix.artifact_path }}"
          ditto -c -k --sequesterRsrc --keepParent . "../../${{ matrix.artifact_name }}.zip"

      - name: Archive artifact (Linux)
        if: runner.os == 'Linux'
        run: |
          cd "${{ matrix.artifact_path }}"
          zip -qry "../../${{ matrix.artifact_name }}.zip" .

      - name: Archive artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "${{ matrix.artifact_path }}\*" -DestinationPath "${{ matrix.artifact_name }}.zip" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.zip
          if-no-files-found: error

  publish-main-release:
    name: Publish latest successful main build
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Move rolling release tag
        run: |
          git tag -f latest-main-successful-build "$GITHUB_SHA"
          git push origin latest-main-successful-build --force

      - name: Publish rolling main release
        uses: ncipollo/release-action@v1
        with:
          tag: latest-main-successful-build
          name: Latest successful main build
          body: |
            This release is automatically updated after the Desktop Build workflow succeeds on main.

            Source commit: ${{ github.sha }}
          artifacts: release-assets/*.zip
          allowUpdates: true
          replacesArtifacts: true
          removeArtifacts: true
          artifactErrorsFailBuild: true
          makeLatest: false
