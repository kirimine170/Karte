name: Desktop Build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - '.github/workflows/ci.yml'
      - '**/*.go'
      - 'frontend/**'
      - 'build/**'
      - 'templates/**'
      - 'themes/**'
      - 'wails.json'
      - 'go.mod'
      - 'go.sum'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ci.yml'
      - '**/*.go'
      - 'frontend/**'
      - 'build/**'
      - 'templates/**'
      - 'themes/**'
      - 'wails.json'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-build:
    name: PR build check
    if: github.event_name == 'pull_request'
    runs-on: macos-15
    env:
      GOFLAGS: -buildvcs=false
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Download Go dependencies
        run: go mod download

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.2

      - name: Install PortAudio
        run: |
          brew update
          brew install portaudio

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit

      - name: Prepare placeholder dist
        run: |
          mkdir -p frontend/dist
          touch frontend/dist/.placeholder

      - name: Generate Wails JS bindings
        run: wails generate module

      - name: Build frontend assets
        working-directory: frontend
        run: npm run build

      - name: Build application
        run: wails build -platform darwin/arm64

  release-build:
    name: Build (${{ matrix.os }} - ${{ matrix.arch }})
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    env:
      GOFLAGS: -buildvcs=false
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: amd64
            platform: linux/amd64
          - os: macos-15
            arch: arm64
            platform: darwin/arm64
          - os: macos-15-intel
            arch: amd64
            platform: darwin/amd64
          - os: windows-latest
            arch: amd64
            platform: windows/amd64

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Download Go dependencies
        run: go mod download

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.2

      - name: Install PortAudio (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev

      - name: Install Wails dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            libgdk-pixbuf2.0-dev \
            libpango1.0-dev \
            libatk1.0-dev \
            libcairo2-dev \
            libgirepository1.0-dev \
            pkg-config

      - name: Install PortAudio (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install portaudio

      - name: Install PortAudio (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          C:\msys64\usr\bin\pacman.exe -S --noconfirm --needed `
            mingw-w64-x86_64-gcc `
            mingw-w64-x86_64-pkg-config `
            mingw-w64-x86_64-portaudio
          "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "PKG_CONFIG_PATH=C:\msys64\mingw64\lib\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CGO_ENABLED=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Add sherpa-onnx runtime DLLs to PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $sherpaDir = go list -m -f "{{.Dir}}" github.com/k2-fsa/sherpa-onnx-go-windows
          $dllDir = Join-Path $sherpaDir "lib\x86_64-pc-windows-gnu"
          if (!(Test-Path $dllDir)) {
            throw "sherpa-onnx runtime DLL directory not found: $dllDir"
          }
          $dllDir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit

      - name: Prepare placeholder dist
        run: |
          mkdir -p frontend/dist
          touch frontend/dist/.placeholder

      - name: Prepare font file for Windows build
        if: runner.os == 'Windows'
        run: |
          mkdir -p internal/pdf/fonts
          echo "" > internal/pdf/fonts/NotoSansJP-Regular.ttf || touch internal/pdf/fonts/NotoSansJP-Regular.ttf

      - name: Generate Wails JS bindings
        run: wails generate module

      - name: Build frontend assets
        working-directory: frontend
        run: npm run build

      - name: Verify frontend/dist exists
        run: |
          if [ ! -d "frontend/dist" ] || [ -z "$(ls -A frontend/dist 2>/dev/null)" ]; then
            echo "Error: frontend/dist is missing or empty"
            exit 1
          fi

      - name: Build application (Windows)
        if: runner.os == 'Windows'
        run: go run ./cmd/buildmatrix --targets windows

      - name: Build application
        if: runner.os != 'Windows'
        run: wails build -platform ${{ matrix.platform }}
