name: ASR Audio CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/asr-audio-ci.yml'
      - 'internal/asr/**'
      - 'internal/audio/**'
      - 'go.mod'
      - 'go.sum'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/asr-audio-ci.yml'
      - 'internal/asr/**'
      - 'internal/audio/**'
      - 'go.mod'
      - 'go.sum'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  asr-audio:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    env:
      GOFLAGS: -buildvcs=false
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download Go dependencies
        run: go mod download

      - name: Configure native Windows audio runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          C:\msys64\usr\bin\pacman.exe -S --noconfirm --needed `
            mingw-w64-x86_64-gcc `
            mingw-w64-x86_64-pkg-config `
            mingw-w64-x86_64-portaudio
          "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          $sherpaDir = go list -m -f "{{.Dir}}" github.com/k2-fsa/sherpa-onnx-go-windows
          (Join-Path $sherpaDir "lib\x86_64-pc-windows-gnu") | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "PKG_CONFIG_PATH=C:\msys64\mingw64\lib\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CGO_ENABLED=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run ASR and audio tests
        run: go test ./internal/asr ./internal/audio
