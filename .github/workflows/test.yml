name: Backend CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test.yml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/asr-audio-ci.yml'
      - '.github/workflows/frontend-ci.yml'
      - '.github/workflows/frontend-e2e.yml'
      - 'RELEASE_CRITERIA_V1.md'
      - '*.go'
      - 'cmd/**'
      - 'internal/**'
      - '!internal/asr/**'
      - '!internal/audio/**'
      - 'testdata/renderer-contract/**'
      - 'go.mod'
      - 'go.sum'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/test.yml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/asr-audio-ci.yml'
      - '.github/workflows/frontend-ci.yml'
      - '.github/workflows/frontend-e2e.yml'
      - 'RELEASE_CRITERIA_V1.md'
      - '*.go'
      - 'cmd/**'
      - 'internal/**'
      - '!internal/asr/**'
      - '!internal/audio/**'
      - 'testdata/renderer-contract/**'
      - 'go.mod'
      - 'go.sum'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-22.04
    env:
      GOFLAGS: -buildvcs=false
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download Go dependencies
        run: go mod download

      - name: Test Karte Renderer dependency
        run: go test github.com/kirimine170/KarteRenderer/...

      - name: Prepare placeholder frontend assets
        run: |
          mkdir -p frontend/dist
          touch frontend/dist/.placeholder

      - name: Run application package tests
        run: go test .

      - name: Run backend tests
        run: go test $(go list ./cmd/... ./internal/... | grep -v internal/asr | grep -v internal/audio)
