# .github/labeler.yml
## ディレクトリ単位でラベルを設定できるものがあれば追加．

area/frontend:
  - changed-files:
      - any-glob-to-any-file:
          - "frontend/**"
          - "wails/**"

area/backend:
  - changed-files:
      - any-glob-to-any-file:
          - "backend/**"
          - "internal/**"

area/asr:
  - changed-files:
      - any-glob-to-any-file:
          - "data/asr/**"
          - "internal/asr/**"

area/ocr:
  - changed-files:
      - any-glob-to-any-file:
          - "data/ocr/**"
          - "internal/ocr/**"

area/devops:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"
          - "scripts/**"

os/windows:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*_windows.go"
          - "**/*_windows_test.go"
          - "windows.md"
          - ".github/workflows/windows-release.yml"

prereq/ffmpeg:
  - changed-files:
      - any-glob-to-any-file:
          - "internal/audio/**"
          - "cmd/buildmatrix/**"
          - ".github/workflows/windows-release.yml"
