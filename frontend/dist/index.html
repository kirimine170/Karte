<!doctype html>
<script type="module" crossorigin src="/assets/index.8a6dfe0a.js"></script>

<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Karte — Editor</title>
<style>
  :root {
    --main-background: #ffffff;
    --text-color: #1f2937;
    --browsername-color: #111827;
    --backgroundcolor: #f9fafb;
    --backgroundcolor-unhover: #f3f4f6;
    --opened-tab-backgroundcolor: #e5e7eb;
    --border-color: #e5e7eb;
    --border-color-unhover: #eaecef;
    --borderline-color: #d1d5db;
    --shadow-color: rgba(17, 24, 39, 0.18);
    --shadow-color-unhover: rgba(17, 24, 39, 0.08);
    --input-color-unhover: #ffffff;
    --loading-color: #7c3aed;
    --closebutton-color: #7c3aed;
  }

  :root[data-theme="dark"] {
    --main-background: #0b0f14;
    --text-color: #e5e7eb;
    --browsername-color: #f9fafb;
    --backgroundcolor: #0f1720;
    --backgroundcolor-unhover: #111827;
    --opened-tab-backgroundcolor: #1f2937;
    --border-color: #243041;
    --border-color-unhover: #1e293b;
    --borderline-color: #324155;
    --shadow-color: rgba(0, 0, 0, 0.5);
    --shadow-color-unhover: rgba(0, 0, 0, 0.3);
    --input-color-unhover: #111827;
    --loading-color: #a78bfa;
    --closebutton-color: #a78bfa;
  }

  :root[data-theme="hc"] {
    --main-background: #ffffff;
    --text-color: #000000;
    --browsername-color: #000000;
    --backgroundcolor: #ffffff;
    --backgroundcolor-unhover: #f2f2f2;
    --opened-tab-backgroundcolor: #e6e6e6;
    --border-color: #111111;
    --border-color-unhover: #4d4d4d;
    --borderline-color: #000000;
    --shadow-color: rgba(0, 0, 0, 0.25);
    --shadow-color-unhover: rgba(0, 0, 0, 0.15);
    --input-color-unhover: #ffffff;
    --loading-color: #7c3aed;
    --closebutton-color: #7c3aed;
  }

  :root {
    --bg: var(--main-background);
    --panel: var(--backgroundcolor);
    --ink: var(--text-color);
    --mute: var(--mute, #6b7280);
    --line: var(--border-color);
    --brand: var(--browsername-color);
    --accent: var(--loading-color);
    --radius: 10px;
    --gap: 12px;
    --gap2: 16px;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme]) {
      color-scheme: dark;
    }
  }

  @media (prefers-color-scheme: light) {
    :root:not([data-theme]) {
      color-scheme: light;
    }
  }

  * {
    box-sizing: border-box
  }

  html,
  body {
    min-height: 100%;
    height: 100%;
  }

  html {
    background: var(--bg);
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 13px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", "Meiryo", sans-serif;
  }

  a {
    color: inherit;
    text-decoration: none
  }

  .bar {
    height: 44px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 12px;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, color-mix(in srgb, var(--main-background) 98%, transparent), transparent)
  }

  .logo {
    font-weight: 700;
    letter-spacing: 0.4px
  }

  .hint {
    color: var(--mute);
    font-size: 12px
  }

  .status {
    margin-left: auto;
    color: var(--mute)
  }

  .layout {
    height: 100%;
    display: grid;
    grid-template-columns: 260px 1fr;
    height: calc(100% - 44px);
  }

  .side {
    border-right: 1px solid var(--line);
    padding: 12px;
    background: var(--panel)
  }

  .search {
    display: flex;
    gap: 6px;
    margin-bottom: 10px
  }

  .search input {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--ink);
    padding: 8px 10px;
    border-radius: 8px;
    outline: 0
  }

  .tree {
    overflow: auto;
    height: calc(100% - 44px)
  }

  .item {
    padding: 6px 8px;
    border-radius: 8px;
    color: var(--ink);
    border: 1px solid transparent;
    display: block
  }

  .item:hover {
    background: var(--backgroundcolor-unhover);
    border-color: var(--line)
  }

  .item.active {
    background: var(--opened-tab-backgroundcolor);
    border-color: var(--borderline-color)
  }

  .main {
    display: flex;
    flex-direction: column;
    height: 100%;
    padding: var(--gap2);
  }

  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: var(--gap);
    border-bottom: 1px solid var(--line);
    flex-shrink: 0;
  }

  .tab {
    padding: 8px 16px;
    background: transparent;
    border: none;
    color: var(--mute);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
  }

  .tab:hover {
    color: var(--ink);
    background: var(--backgroundcolor-unhover);
  }

  .tab.active {
    color: var(--ink);
    border-bottom-color: var(--accent);
  }

  .tab-content {
    display: none;
    flex: 1;
    min-height: 0;
  }

  .tab-content.active {
    display: flex;
    flex-direction: column;
  }

  .graph-container {
    width: 100%;
    flex: 1;
    min-height: 0;
    position: relative;
    overflow: hidden;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--panel);
  }

  textarea {
    width: 100%;
    height: 100%;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--ink);
    padding: 12px;
    border-radius: var(--radius);
    resize: none;
    outline: none;
    font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }

  textarea:focus {
    box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 35%, transparent) inset
  }

  iframe {
    width: 100%;
    height: 100%;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--bg)
  }

  .row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--gap);
    flex: 1;
    min-height: 0;
  }

  .btn {
    background: var(--accent);
    color: var(--browsername-color);
    border: 0;
    border-radius: 8px;
    padding: 6px 10px;
    cursor: pointer
  }

  .btn[disabled] {
    opacity: .6
  }

  .toolbar {
    display: flex;
    gap: 8px;
    margin-left: 8px
  }

  .pill {
    border: 1px solid var(--line);
    padding: 4px 8px;
    border-radius: 999px;
    color: var(--mute);
    font-size: 12px
  }

  ::selection {
    background-color: color-mix(in srgb, var(--accent) 25%, transparent)
  }

  ::-webkit-scrollbar {
    width: 8px;
    height: 8px
  }

  ::-webkit-scrollbar-track {
    background: var(--panel)
  }

  ::-webkit-scrollbar-thumb {
    background: var(--border-color);
    border-radius: 4px
  }

  ::-webkit-scrollbar-thumb:hover {
    background: var(--borderline-color)
  }

  ::-webkit-scrollbar-corner {
    background: var(--panel)
  }

  @media (max-width: 1100px) {
    .layout {
      grid-template-columns: 1fr
    }

    .side {
      display: none
    }

    .row {
      grid-template-columns: 1fr;
      flex: 1;
      min-height: 0;
    }
  }
</style>
<div class="bar">
  <div class="logo">Karte</div>
  <div class="pill">Editor</div>
  <div class="hint">Ctrl/Cmd+S: 保存・再ビルド</div>
  <div class="toolbar">
    <label class="hint" for="theme">Theme</label>
    <select id="theme">
      <option value="light">Light</option>
      <option value="dark">Dark</option>
      <option value="hc">High Contrast</option>
    </select>
    <label class="hint" for="hardwrap" style="display:flex;align-items:center;gap:6px">
      <input id="hardwrap" type="checkbox" /> Hard wrap (単一改行→<br>)
    </label>
    <button class="btn" id="saveBtn">保存</button>
    <button class="btn" id="newBtn">新規</button>
    <button class="btn" id="openBtn">表示</button>
    <button class="btn" id="exportPdfBtn">PDFエクスポート</button>
    <button class="btn" id="customCssBtn">Custom CSS</button>
    <span id="customCssStatus" style="margin-left:8px;font-size:12px;color:#6b7280"></span>
  </div>
  <div class="status" id="status"></div>
</div>
<div class="layout">
  <aside class="side">
    <div class="search">
      <input id="q" placeholder="ファイル検索 (content/)" />

    <div class="tree" id="tree"></div>

  <main class="main">
    <div class="tabs">
      <button class="tab active" data-tab="editor">エディター</button>

      <div class="row">
        <textarea id="editor" spellcheck="false"></textarea>
        <iframe id="preview"></iframe>
      </div>
    </div>
    <div class="tab-content" id="graph-tab">
      <div
        style="padding: 10px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; gap: 10px;">
        <button id="toggleTagNodesBtn" class="btn" style="font-size: 12px;">タグノード表示: ON</button>
        <span style="font-size: 12px; color: var(--mute);">同じタグを持つドキュメントをタグノードで接続します</span>
      </div>
      <div class="graph-container" id="graph-container"></div>
    </div>
  </main>
</div>

<!-- File name input modal -->
<div id="filenameModal" class="modal" style="display: none;">
  <div class="modal-content">
    <h3>新規ファイル作成</h3>
    <p>ファイル名を入力してください（.md拡張子は自動で追加されます）:</p>
    <input type="text" id="filenameInput" placeholder="例: my-document" />
    <div class="modal-buttons">
      <button id="createFileBtn" class="btn">作成</button>
      <button id="cancelFileBtn" class="btn btn-secondary">キャンセル</button>
    </div>
  </div>
</div>

<style>
  .modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.5);
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .modal-content {
    background: var(--main-background);

    border-radius: 8px;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    min-width: 300px;
    max-width: 500px;
  }

  .modal-content h3 {
    margin: 0 0 10px 0;
    color: var(--text-color);
  }

  .modal-content p {
    margin: 0 0 15px 0;
    color: var(--text-color);
    font-size: 14px;
  }

  .modal-content input {
    width: 100%;
    padding: 8px 12px;
    border: 1px solid var(--border-color);
    border-radius: 4px;
    font-size: 14px;
    margin-bottom: 15px;

  }

  .modal-buttons {

  }

  }
</style>

<!-- Custom CSS modal -->
<div id="customCssModal" class="modal" style="display:none;">
  <div class="modal-content" style="min-width:520px;">
    <h3>プレビュー用 Custom CSS</h3>
    <p>ここに記述したCSSはプレビューにのみ適用され、テーマCSSより優先されます。</p>
    <textarea id="customCssTextarea" style="width:100%;height:260px;white-space:pre;" spellcheck="false"></textarea>
    <div class="modal-buttons">

      <button id="clearCustomCssBtn" class="btn">クリア</button>
      <button id="cancelCustomCssBtn" class="btn btn-secondary">閉じる</button>
    </div>
  </div>
  <style>
    #customCssModal .modal-content textarea {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background: var(--input-color-unhover);
      color: var(--text-color);
      padding: 10px;
    }
  </style>
</div>

<!-- Conflict resolution modal -->
<div id="conflictModal" class="modal" style="display:none;">
  <div class="modal-content" style="min-width:600px;max-width:800px;">
    <h3>ファイルが他の場所で変更されました</h3>
    <p id="conflictFilePath" style="font-weight:bold;margin-bottom:15px;"></p>
    <p style="margin-bottom:20px;">同じファイルが別の場所で編集されています。解決方法を選択してください：</p>

    <div class="conflict-options" style="margin-bottom:20px;">
      <label class="conflict-option">
        <input type="radio" name="conflictResolution" value="local" checked>
        <div>
          <strong>自分の変更を保持</strong>
          <small>あなたが編集した内容を優先します</small>
        </div>
      </label>

      <label class="conflict-option">
        <input type="radio" name="conflictResolution" value="remote">
        <div>
          <strong>他の変更を採用</strong>
          <small>別の場所での変更を優先します</small>
        </div>
      </label>

      <label class="conflict-option">
        <input type="radio" name="conflictResolution" value="merge">
        <div>
          <strong>両方を統合（推奨）</strong>
          <small>自動的に両方の変更を統合します</small>
        </div>
      </label>
    </div>

    <details class="conflict-diff" style="margin-bottom:20px;">
      <summary style="cursor:pointer;padding:10px;background:var(--backgroundcolor-unhover);border-radius:6px;">変更内容を比較
      </summary>
      <div class="diff-view"
        style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;max-height:400px;overflow:auto;">
        <div class="diff-local" style="border:1px solid var(--border-color);border-radius:6px;padding:10px;">
          <h4 style="margin-top:0;">あなたの変更</h4>
          <pre id="diffLocal"
            style="background:var(--input-color-unhover);padding:10px;border-radius:4px;overflow:auto;white-space:pre-wrap;font-size:12px;margin:0;"></pre>
        </div>
        <div class="diff-remote" style="border:1px solid var(--border-color);border-radius:6px;padding:10px;">
          <h4 style="margin-top:0;">他の変更</h4>
          <pre id="diffRemote"
            style="background:var(--input-color-unhover);padding:10px;border-radius:4px;overflow:auto;white-space:pre-wrap;font-size:12px;margin:0;"></pre>
        </div>
      </div>
    </details>

    <div class="modal-buttons">
      <button id="resolveConflictBtn" class="btn">解決</button>
      <button id="cancelConflictBtn" class="btn btn-secondary">キャンセル</button>
    </div>
  </div>
  <style>
    .conflict-option {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 12px;
      margin-bottom: 8px;
      border: 2px solid var(--border-color);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .conflict-option:hover {
      background: var(--backgroundcolor-unhover);
      border-color: var(--accent);
    }

    .conflict-option input[type="radio"] {
      margin-top: 4px;
    }

    .conflict-option strong {
      display: block;
      margin-bottom: 4px;
    }

    .conflict-option small {
      display: block;
      color: var(--mute);
      font-size: 12px;
    }
  </style>
</div>
