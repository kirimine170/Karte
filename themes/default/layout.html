<!doctype html>
<html>
<meta charset="utf-8" />
<title>{{TITLE}}</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
<style>
  /* Light theme (default) */
  :root {
    --page-bg: #ffffff;
    --text: #1f2937;
    --surface: #f9fafb;
    --border: #e5e7eb;
    --link: #7c3aed;
    /* violet */
  }

  /* Dark theme */
  :root[data-theme="dark"] {
    --page-bg: #0b0f14;
    --text: #e5e7eb;
    --surface: #0f1720;
    --border: #243041;
    --link: #a78bfa;
    /* violet light */
  }

  /* High Contrast theme */
  :root[data-theme="hc"] {
    --page-bg: #ffffff;
    --text: #000000;
    --surface: #ffffff;
    --border: #111111;
    --link: #7c3aed;
    /* violet */
  }

  html,
  body {
    min-height: 100%;
  }

  html {
    background: var(--page-bg);
  }

  body {
    background: var(--page-bg);
    color: var(--text)
  }

  header.sitebar {
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 12px;
    align-items: center
  }

  header.sitebar .spacer {
    flex: 1
  }

  main.container {
    max-width: 960px;
    margin: 24px auto;
    padding: 0 16px
  }

  a {
    color: var(--link)
  }

  article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px
  }

  select.theme {
    min-width: 140px
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme]) {
      color-scheme: dark;
    }
  }

  @media (prefers-color-scheme: light) {
    :root:not([data-theme]) {
      color-scheme: light;
    }
  }

  /* Respect Pico base but override surfaces via CSS vars */
  :root {
    --pico-background-color: var(--page-bg);
    --pico-color: var(--text);
  }

  article :where(h1, h2, h3) {
    color: var(--text);
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
<script>mermaid.initialize({ startOnLoad: true });</script>

<body>
  <header class="sitebar">
    <strong>Karte</strong>
    <span class="spacer"></span>
    <label for="theme" class="layout-theme" style="margin-right:6px">Theme</label>
    <select id="theme" class="theme layout-theme" aria-label="Theme selector">
      <option value="light">Light</option>
      <option value="dark">Dark</option>
    </select>
  </header>
  <main class="container">
    <article>
      {{CONTENT}}
    </article>
  </main>
  <script>
    (function () {
      const KEY = 'karte-theme';
      const root = document.documentElement;
      const sel = document.getElementById('theme');
      // 編集画面内のプレビューiframeではヘッダのテーマUIを隠す
      if (window.self !== window.top) {
        const els = document.querySelectorAll('.layout-theme');
        els.forEach(el => el.style.display = 'none');
      }
      function apply(name) {
        if (name === 'dark') {
          root.setAttribute('data-theme', 'dark');
          sel.value = 'dark';
        } else {
          root.removeAttribute('data-theme');
          sel.value = 'light';
          name = 'light';
        }
        try { localStorage.setItem(KEY, name); } catch { }
      }
      // initial
      (function () {
        try {
          const saved = localStorage.getItem(KEY);
          if (saved) { apply(saved); return; }
        } catch { }
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        apply(prefersDark ? 'dark' : 'light');
      })();
      // on change
      sel.addEventListener('change', function (e) { apply(e.target.value); });
    })();
  </script>
</body>

</html>
